[workspace]
resolver = "3"
members = ["crates/core", "crates/web", "crates/portraits"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tuxtrivia-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
fastrand = { version = "2", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
