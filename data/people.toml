# TuxTrivia roster.
#
# Each [[person]] generates many questions: who made X, what did Y make,
# when was X released, guess-who from clues, and who-is-this (portrait).
#
# Fields:
#   id         slug, unique; also the portrait file stem
#   name       display name
#   born       optional birth year
#   country    optional, as commonly described
#   wikipedia  optional English Wikipedia article title about the person;
#              its free lead image becomes the portrait
#   category   pioneers | unix | languages | distros | tools
#   creations  list of { name, year?, kind }
#              kind: language | os | distro | tool | software | algorithm |
#                    concept | hardware | book | protocol | format
#              Leave `year` out when it's fuzzy; only dated creations
#              appear in "when" questions.
#   clues      vaguest first; never include the person's surname.
#              (`cargo test` checks this, and that the file parses.)
#
# Co-creators: give the creation the exact same name on each person so
# they're never used as wrong answers for each other.

# ─── Pioneers & theory ────────────────────────────────────────────────

